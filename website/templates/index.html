<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 selection:bg-cyan-500 selection:text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle Robot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in { animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    </style>
</head>
<body class="min-h-full text-slate-100 p-4 md:p-8 flex flex-col justify-center">

    <div class="max-w-7xl mx-auto w-full space-y-6">
        
        <header class="flex items-center gap-3 border-b border-slate-800 pb-4">
            <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_12px_rgba(16,185,129,0.5)]"></div>
            <h1 class="text-sm font-mono tracking-widest text-slate-400 uppercase font-bold">Robot Control Station // <span class="text-yellow-400 font-extrabold">Banane v2.0</span></h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
            
            <div class="lg:col-span-4 flex flex-col gap-6">
                
                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                    <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Contrôles Manuels</h3>
                    
                    <div class="grid grid-cols-3 gap-2.5 max-w-[240px] mx-auto w-full aspect-square justify-center items-center my-2">
                        <div></div>
                        <button id="up" class="control-btn direction h-16 w-16 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-150 flex items-center justify-center col-start-2 row-start-1">▲</button>
                        <div></div>
                        <button id="left" class="control-btn direction h-16 w-16 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-150 flex items-center justify-center col-start-1 row-start-2">◀</button>
                        <div class="h-16 w-16 border border-slate-800/40 rounded-xl bg-slate-950/40 flex items-center justify-center text-slate-600 font-mono text-xs">PAD</div>
                        <button id="right" class="control-btn direction h-16 w-16 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-150 flex items-center justify-center col-start-3 row-start-2">▶</button>
                        <div></div>
                        <button id="down" class="control-btn direction h-16 w-16 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-150 flex items-center justify-center col-start-2 row-start-3">▼</button>
                    </div>
                </div>

                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                    <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Cibles</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="chair">chair</button>
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="car">car</button>
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="banana">Banana</button>
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="teddy bear">teddy bear</button>
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="bottle">bottle</button>
                        <button class="control-btn object py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-150" data-target="person">Person</button>
                    </div>
                </div>

                <input type="text" id="console-input" class="w-full bg-slate-950 border border-slate-800 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 py-3 px-4 rounded-xl font-mono text-sm shadow-inner transition-all duration-200" placeholder="> entrer séquence manuelle...">


            </div>

                
            <div class="lg:col-span-8 flex flex-col">
                <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4 h-full">
                    <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Camera Feed</h3>
                    <div class="camera-feed bg-slate-950 border border-slate-800/80 rounded-xl overflow-hidden flex items-center justify-center relative min-h-[400px] lg:min-h-[500px] h-full shadow-inner group">
                        <img id="main-image" src="https://via.placeholder.com/800x600?text=Flux+Cam%C3%A9ra" alt="Vue du robot" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-300">
                    </div>
                </div>
            </div>

        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4 md:col-span-1">
                <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Bip Bip</h3>
                <div class="flex items-center justify-center h-full min-h-[68px]">
                    <button class="control-btn object py-3 px-4 bg-red-600 hover:bg-red-500 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-lg shadow-red-900/30 transition-all duration-150 w-full h-full" data-target="klaxon">
                        Klaxon
                    </button>
                </div>
            </div>              

            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4 md:col-span-2">
                <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Réglages</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 h-full items-center">
                    
                    <div class="flex flex-col gap-2 bg-slate-950/40 p-3 rounded-xl border border-slate-800/40">
                        <label for="latency-slider" class="text-xs font-mono text-slate-400 flex justify-between">
                            Latence <span id="latency-val" class="text-cyan-400 font-bold">2000 ms</span>
                        </label>
                        <input type="range" id="latency-slider" min="0" max="5000" value="2000" class="w-full accent-cyan-500">
                    </div>

                    <div class="flex flex-col gap-2 bg-slate-950/40 p-3 rounded-xl border border-slate-800/40">
                        <label for="sensitivity-slider" class="text-xs font-mono text-slate-400 flex justify-between">
                            échelle angulaire<span id="sensitivity-val" class="text-cyan-400 font-bold">200</span>
                        </label>
                        <input type="range" id="sensitivity-slider" min="2" max="500" step="1" value="200" class="w-full accent-cyan-500">
                    </div>

                </div>
            </div>

        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-slate-800/60 pb-2">
                    <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase">Objectifs</h3>
                    <button id="clear-queue" class="py-1 px-3 bg-rose-600/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 hover:border-transparent text-xs font-mono uppercase font-bold rounded-md transition-all duration-200 active:scale-95">Effacer</button>
                </div>
                
                <div id="target-queue" class="queue-container flex flex-wrap gap-2 min-h-[45px] p-3 bg-slate-950/40 rounded-xl border border-slate-800/40 items-center">
                                    
                </div>
            </div>
            
            <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <h3 class="text-xs font-mono font-bold tracking-wider text-slate-400 uppercase border-b border-slate-800/60 pb-2">Logs système</h3>
                <div id="log-container" class="log-container custom-scrollbar bg-slate-950 border border-slate-950 rounded-xl p-4 h-40 overflow-y-auto font-mono text-xs flex flex-col gap-1.5 shadow-inner">
                
                </div>
            </div>

        </div>
    </div>

    <script src="../scripts/script.js"></script>
</body>
</html>
